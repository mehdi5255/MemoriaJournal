# Intégration continue : à chaque push et pull request
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      # Valeurs de test uniquement (les vraies clés ne sont jamais dans le dépôt)
      SECRET_KEY: ci-Xk9vQ2mL7pR4tW8zB3nF6hJ1cD5gS0aE-only-for-tests-not-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      GEMINI_API_KEY: ""
      HF_TOKEN: ""

    defaults:
      run:
        working-directory: MemoriA

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Vérifications Django
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Tests avec couverture (IA mockée, Celery en mode eager)
        run: |
          coverage run manage.py test
          coverage report --fail-under=80
          coverage html -d htmlcov

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-coverage
          path: MemoriA/htmlcov/

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t memoria:ci .
